name: Run Crypto Scanner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-scanner]

concurrency:
  group: crypto-scanner-private
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Crypto Scanner Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTO_PAIRS: ${{ secrets.CRYPTO_PAIRS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_TASKS_CREDENTIALS }}
          GOOGLE_TASKS_CREDENTIALS: ${{ secrets.GOOGLE_TASKS_CREDENTIALS }}
        run: python main.py

      - name: Commit Cache Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(cache): update crypto cache [skip ci]"
          file_pattern: "cache_krypto.json"
